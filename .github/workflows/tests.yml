name: tests

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Generate package-lock.json, which the CLI reads
        run: npm install --package-lock-only --ignore-scripts
      - name: Run the linter
        run: bun run lint
      - name: Run the tests
        run: bun test
        env:
          CI: true
